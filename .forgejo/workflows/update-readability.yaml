name: "Mise à jour automatique Readability"

on:
  schedule:
    # Exécution chaque lundi à 04h00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch: # Permet de déclencher la mise à jour manuellement via l'interface Forgejo

jobs:
  update-dependencies:
    runs-on: native
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer PHP et Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Mettre à jour fivefilters/readability.php
        run: |
          composer update fivefilters/readability.php --no-interaction --optimize-autoloader --no-dev

      - name: Détecter et commiter les modifications
        run: |
          if [ -n "$(git status --porcelain composer.lock vendor/)" ]; then
            git config user.name "forgejo-actions[bot]"
            git config user.email "actions@forgejo.local"
            git add composer.json composer.lock vendor/
            git commit -m "chore(deps): bump fivefilters/readability.php to latest"
            git push origin main
          else
            echo "Readability est déjà sur sa dernière version."
          fi