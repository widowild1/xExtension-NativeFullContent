name: "Mise à jour Readability -> Forgejo"

on:
  schedule:
    # Exécution automatique chaque lundi matin à 04h00
    - cron: '0 4 * * 1'
  workflow_dispatch: # Permet aussi un déclenchement manuel en 1 clic dans Forgejo

jobs:
  bump-readability:
    runs-on: native
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Mettre à jour fivefilters/readability.php
        run: |
          composer update fivefilters/readability.php --no-interaction --optimize-autoloader --no-dev

      - name: Commiter et pousser sur Forgejo
        run: |
          if [ -n "$(git status --porcelain composer.json composer.lock vendor/)" ]; then
            git config user.name "forgejo-bot"
            git config user.email "bot@forgejo.local"
            git add composer.json composer.lock vendor/
            git commit -m "chore(deps): mise à jour fivefilters/readability.php"
            git push origin main
          else
            echo "Readability est déjà à jour."
          fi